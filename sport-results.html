<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KAIFZEIT Sport · Результаты</title>
<link rel="icon" type="image/png" href="brand/sport-favicon.png">
<style>
@font-face{font-family:'Manrope';font-weight:400 800;font-display:swap;src:url('fonts/manrope-latin-variable.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:'Manrope';font-weight:400 800;font-display:swap;src:url('fonts/manrope-cyrillic-variable.woff2') format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Outfit';font-weight:100 900;font-display:swap;src:url('fonts/outfit-latin-variable.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--acc:#c9ec9b;--line:#ffffff1c}
body{font-family:Manrope,Arial,sans-serif;background:radial-gradient(ellipse at 80% 0%,#283b2455,transparent 50%),#101010;color:#f3efed;padding:28px 36px;text-align:center;margin:0;min-height:100vh;box-sizing:border-box}
body>p:first-of-type{font-size:13px}
body>p:first-of-type a{color:#a8a0a0!important;text-decoration:none;border-bottom:1px solid #ffffff30}
h1{font:500 clamp(40px,6vw,80px)/1 Outfit,Manrope,sans-serif;letter-spacing:-2px;color:#f3efed;margin:30px 0 10px}
table{width:100%;max-width:1200px;margin:24px auto;border-collapse:collapse;background:#161414;border:1px solid var(--line);font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid #ffffff12;padding:16px 12px;text-align:center}
th{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#a8a0a0;font-weight:600;border-bottom:1px solid var(--line)}
th:nth-child(6),th:nth-child(10),td:nth-child(6),td:nth-child(10){color:var(--acc)}
th:last-child{color:var(--acc)}
td{font-size:18px;color:#cfc8c6}
td:nth-child(2){text-align:left;font-weight:700;color:#f3efed}
td:first-child{font-weight:700;color:#f3efed}
td:last-child{font:600 26px Outfit,Manrope,sans-serif;color:#f3efed}
tbody tr:first-child td:first-child{color:var(--acc)}
td.editable{cursor:pointer}
td.editable:hover{background:#ffffff0a}
td input{width:100%;background:#101010;color:#fff;border:1px solid var(--acc);text-align:center;box-sizing:border-box;font:inherit;padding:4px}
.buttons{margin:18px 0}
button{margin:0 6px;padding:14px 28px;font:700 14px Manrope,Arial,sans-serif;background:var(--acc);color:#191919;border:none;border-radius:2px;cursor:pointer;transition:.2s}
button:hover{background:#f3efed}
button#hideBtn{background:transparent;color:#f3efed;border:1px solid var(--line)}
button#hideBtn:hover{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<p style="text-align:left"><a href="/" style="color:#ffb3d9">← Главная</a> &nbsp;·&nbsp; <a href="sport.html" style="color:#ffb3d9">KAIFZEIT Sport</a></p>
<h1>KAIFZEIT SPORT Nr.6</h1>
<p style="color:#ff4fa3;"></p>
<div class="buttons">
    <button id="showNextBtn">Next</button>
    <button id="hideBtn">Скрыть результаты</button>
</div>
<table id="table">
<thead>
<tr>
    <th>Место</th>
    <th>Команда</th>
    <th>1 тур</th>
    <th>2 тур</th>
    <th>3 тур</th>
    <th>После 3</th>
    <th>4 тур</th>
    <th>5 тур</th>
    <th>6 тур</th>
    <th>После 6</th>
    <th>7 тур</th>
    <th>Итого</th>
</tr>
</thead>
<tbody>
    <tr><td>1</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
    <tr><td>2</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
    <tr><td>3</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
    <tr><td>4</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
    <tr><td>5</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
    <tr><td>6</td><td class="editable team"></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
</tbody>
</table>

<script>
// Пересчёт и сортировка
function updateTable() {
    const rows = Array.from(document.querySelectorAll("#table tbody tr"));
    rows.forEach(row => {
        const c = row.cells;
        const t1 = +c[2].innerText || 0;
        const t2 = +c[3].innerText || 0;
        const t3 = +c[4].innerText || 0;
        const t4 = +c[6].innerText || 0;
        const t5 = +c[7].innerText || 0;
        const t6 = +c[8].innerText || 0;
        const t7 = +c[10].innerText || 0;
        
        c[5].innerText = t1 + t2 + t3;
        c[9].innerText = t1 + t2 + t3 + t4 + t5 + t6;
        c[11].innerText = t1 + t2 + t3 + t4 + t5 + t6 + t7;
    });
    
    // Сортировка по итогу
    rows.sort((a, b) => (+b.cells[11].innerText) - (+a.cells[11].innerText));
    
    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = '';
    rows.forEach((row, i) => {
        row.cells[0].innerText = i + 1;
        tbody.appendChild(row);
    });
}

let currentVisible = 0;

// Показать следующую строку (снизу вверх)
function showNextRow() {
    updateTable();
    const rows = document.querySelectorAll("#table tbody tr");
    if (currentVisible >= rows.length) return;
    
    const indexToShow = rows.length - 1 - currentVisible;
    const row = rows[indexToShow];
    row.style.transition = "none";
    row.style.opacity = "0";
    row.style.transform = "translateY(50px)";
    
    setTimeout(() => {
        row.style.transition = "all 0.8s ease";
        row.style.opacity = "1";
        row.style.transform = "translateY(0)";
    }, 30);
    
    currentVisible++;
}

// Скрыть все
function hideResults() {
    const rows = document.querySelectorAll("#table tbody tr");
    rows.forEach(row => {
        row.style.transition = "all 0.5s ease";
        row.style.opacity = "0";
        row.style.transform = "translateY(40px)";
    });
    currentVisible = 0;
}

// Редактирование ячеек (тур + команда)
document.querySelectorAll("#table td").forEach(cell => {
    const col = cell.cellIndex;
    
    // Тур + колонка "Команда"
    if ([1, 2, 3, 4, 6, 7, 8, 10].includes(col)) {
        cell.classList.add("editable");
        
        cell.onclick = () => {
            if (cell.querySelector("input")) return;
            
            const old = cell.innerText || "";
            const input = document.createElement("input");
            input.type = col === 1 ? "text" : "number";
            input.value = old;
            cell.innerHTML = "";
            cell.appendChild(input);
            input.focus();
            input.select();
            
            const save = () => {
                if (col === 1) {
                    cell.innerText = input.value.trim() || "";
                } else {
                    cell.innerText = Math.max(0, +input.value || 0);
                }
                updateTable();
            };
            
            input.onblur = save;
            input.onkeydown = e => {
                if (e.key === "Enter") save();
                if (e.key === "Escape") {
                    cell.innerText = old;
                }
            };
        };
    }
});

// Кнопки
document.getElementById("showNextBtn").addEventListener("click", showNextRow);
document.getElementById("hideBtn").addEventListener("click", hideResults);

// Изначально всё скрыто
window.onload = () => {
    const rows = document.querySelectorAll("#table tbody tr");
    rows.forEach(row => {
        row.style.opacity = "0";
        row.style.transform = "translateY(50px)";
    });
    updateTable();
};
</script>
</body>
</html>
