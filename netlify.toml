[build]
  publish = "."
  functions = "netlify/functions"

# Old domain -> new domain (keeps old links and QR codes working)
[[redirects]]
  from = "https://allmusicquiz.com/*"
  to = "https://kaifzeit.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.allmusicquiz.com/*"
  to = "https://kaifzeit.com/:splat"
  status = 301
  force = true

# Function sources (quiz answers, raffle logic) must not be downloadable from the site
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# offsidequiz.com (old Offside site) -> Kaifzeit Sport (active once the domain is attached to this site)
[[redirects]]
